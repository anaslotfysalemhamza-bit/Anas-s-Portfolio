<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="City Skyline - A CSS masterpiece by Anas Lotfy showcasing skyscrapers using Grid and Flexbox techniques.">
  <meta name="keywords" content="City Skyline, CSS, Grid, Flexbox, Web Design, Anas Lotfy">
  <title>City Skyline | Anas Lotfy - CSS Masterpiece</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="Blue%203D%20Abstract%20Letter%20S%20Logo.png" type="image/x-icon">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0c10;
      color: #ffffff;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
    }
    
    .gradient-sphere {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(30,136,229,0.15) 0%, rgba(13,71,161,0) 70%);
      border-radius: 50%;
      filter: blur(60px);
      animation: floatSphere 20s infinite ease-in-out;
    }
    
    .sphere-1 { top: -200px; left: -200px; }
    .sphere-2 { bottom: -300px; right: -200px; width: 800px; height: 800px; animation-delay: 5s; }
    .sphere-3 { top: 40%; left: 50%; animation-delay: 10s; width: 400px; height: 400px; }
    
    @keyframes floatSphere {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -50px) scale(1.1); }
      66% { transform: translate(-30px, 40px) scale(0.9); }
    }
    
    .navbar {
      background: rgba(5, 8, 15, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(30, 136, 229, 0.3);
      padding: 1rem 0;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    
    .navbar-brand img {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      transition: all 0.3s;
    }
    
    .navbar-brand img:hover { transform: scale(1.05) rotate(5deg); }
    
    .nav-link {
      position: relative;
      color: #ccd6f6 !important;
      font-weight: 500;
      margin: 0 8px;
      padding: 8px 0;
      transition: all 0.3s;
    }
    
    .nav-link::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #1e88e5, #64b5f6);
      transition: width 0.3s ease;
    }
    
    .nav-link:hover::before, .nav-link.active::before { width: 70%; }
    .nav-link:hover { color: #1e88e5 !important; transform: translateY(-2px); }
    
    .project-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 20px 60px;
    }
    
    .glass-card {
      background: rgba(15, 25, 45, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(30, 136, 229, 0.2);
      border-radius: 32px;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      overflow: hidden;
    }
    
    .city-wrapper {
      background: linear-gradient(135deg, #0a192f, #0a0c10);
      border-radius: 28px;
      padding: 20px;
      margin: 20px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #1e88e5, #0d47a1);
      border: none;
      padding: 12px 32px;
      border-radius: 60px;
      font-weight: 600;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(30, 136, 229, 0.4); }
    
    .footer {
      background: rgba(5, 8, 15, 0.95);
      border-top: 1px solid rgba(30, 136, 229, 0.3);
      padding: 2rem 0;
      text-align: center;
    }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #05080f; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #1e88e5, #0d47a1); border-radius: 10px; }
    
    /* City Skyline Original Styles */
    :root {
      --building-color1: #aa80ff;
      --building-color2: #66cc99;
      --building-color3: #cc6699;
      --building-color4: #538cc6;
      --window-color1: #bb99ff;
      --window-color2: #8cd9b3;
      --window-color3: #d98cb3;
      --window-color4: #8cb3d9;
    }
    
    .background-buildings, .foreground-buildings {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-evenly;
      position: absolute;
      top: 0;
    }
    
    .building-wrap { display: flex; flex-direction: column; align-items: center; }
    .window-wrap { display: flex; align-items: center; justify-content: space-evenly; }
    
    .sky {
      background: radial-gradient(closest-corner circle at 15% 15%, #ffcf33, #ffcf33 20%, #ffff66 21%, #bbeeff 100%);
    }
    
    @keyframes slideIn {
      0% { transform: translateX(-1000px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    
    .city-container {
      height: 70vh;
      min-height: 500px;
      position: relative;
      margin: 20px;
      border-radius: 24px;
      overflow: hidden;
    }
    
    .bb1 { width: 10%; height: 70%; }
    .bb1a { width: 70%; }
    .bb1b { width: 80%; }
    .bb1c { width: 90%; }
    .bb1d { width: 100%; height: 70%; background: linear-gradient(var(--building-color1) 50%, var(--window-color1)); }
    .bb1-window { height: 10%; background: linear-gradient(var(--building-color1), var(--window-color1)); }
    .bb2 { width: 10%; height: 50%; }
    .bb2a { border-bottom: 5vh solid var(--building-color2); border-left: 5vw solid transparent; border-right: 5vw solid transparent; }
    .bb2b { width: 100%; height: 100%; background: repeating-linear-gradient(var(--building-color2), var(--building-color2) 6%, var(--window-color2) 6%, var(--window-color2) 9%); }
    .bb3 { width: 10%; height: 55%; background: repeating-linear-gradient(90deg, var(--building-color3), var(--building-color3), var(--window-color3) 15%); }
    .bb4 { width: 11%; height: 58%; }
    .bb4a { width: 3%; height: 10%; background-color: var(--building-color4); }
    .bb4b { width: 80%; height: 5%; background-color: var(--building-color4); }
    .bb4c { width: 100%; height: 85%; background-color: var(--building-color4); }
    .bb4-window { width: 18%; height: 90%; background-color: var(--window-color4); }
    .fb1 { width: 10%; height: 60%; }
    .fb1a { border-bottom: 7vh solid var(--building-color4); border-left: 2vw solid transparent; border-right: 2vw solid transparent; }
    .fb1b { width: 60%; height: 10%; background-color: var(--building-color4); }
    .fb1c { width: 100%; height: 80%; background: repeating-linear-gradient(90deg, var(--building-color4), var(--building-color4) 10%, transparent 10%, transparent 15%), repeating-linear-gradient(var(--building-color4), var(--building-color4) 10%, var(--window-color4) 10%, var(--window-color4) 90%); }
    .fb2 { width: 10%; height: 40%; }
    .fb2a { width: 100%; border-bottom: 10vh solid var(--building-color3); border-left: 1vw solid transparent; border-right: 1vw solid transparent; }
    .fb2b { width: 100%; height: 75%; background-color: var(--building-color3); }
    .fb2-window { width: 22%; height: 100%; background-color: var(--window-color3); }
    .fb3 { width: 10%; height: 35%; }
    .fb3a { width: 80%; height: 15%; background-color: var(--building-color1); }
    .fb3b { width: 100%; height: 35%; background-color: var(--building-color1); }
    .fb3-window { width: 25%; height: 80%; background-color: var(--window-color1); }
    .fb4 { width: 8%; height: 45%; position: relative; left: 10%; }
    .fb4a { border-top: 5vh solid transparent; border-left: 8vw solid var(--building-color1); }
    .fb4b { width: 100%; height: 89%; background-color: var(--building-color1); display: flex; flex-wrap: wrap; }
    .fb4-window { width: 30%; height: 10%; border-radius: 50%; background-color: var(--window-color1); margin: 10%; }
    .fb5 { width: 10%; height: 33%; position: relative; right: 10%; background: repeating-linear-gradient(var(--building-color2), var(--building-color2) 5%, transparent 5%, transparent 10%), repeating-linear-gradient(90deg, var(--building-color2), var(--building-color2) 12%, var(--window-color2) 12%, var(--window-color2) 44%); }
    .fb6 { width: 9%; height: 38%; background: repeating-linear-gradient(90deg, var(--building-color3), var(--building-color3) 10%, transparent 10%, transparent 30%), repeating-linear-gradient(var(--building-color3), var(--building-color3) 10%, var(--window-color3) 10%, var(--window-color3) 30%); }
    
    @media (max-width: 1000px) {
      :root {
        --building-color1: #000;
        --building-color2: #000;
        --building-color3: #000;
        --building-color4: #000;
        --window-color1: #777;
        --window-color2: #777;
        --window-color3: #777;
        --window-color4: #777;
      }
      .sky { background: radial-gradient(closest-corner circle at 15% 15%, #ccc, #ccc 20%, #445 21%, #223 100%); }
    }
    
    @media (max-width: 768px) {
      .city-container { height: 50vh; min-height: 400px; }
      .project-container { padding: 80px 15px 40px; }
    }
  </style>
</head>
<body>

<div class="animated-bg">
  <div class="gradient-sphere sphere-1"></div>
  <div class="gradient-sphere sphere-2"></div>
  <div class="gradient-sphere sphere-3"></div>
</div>

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html#Home">
      <img src="Blue%203D%20Abstract%20Letter%20S%20Logo.png" alt="Anas Logo">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html#Home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#About">About</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#Skills">Skills</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#Service">Services</a></li>
        <li class="nav-item"><a class="nav-link active" href="index.html#Projects">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html#Contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<main>
  <div class="project-container">
    <div class="glass-card">
      <div class="city-wrapper">
        <div class="text-center mb-4">
          <h1 class="display-5 fw-bold" style="background: linear-gradient(135deg, #aa80ff, #66cc99); -webkit-background-clip: text; background-clip: text; color: transparent;">🌆 City Skyline</h1>
          <p class="text-secondary">A CSS masterpiece showcasing skyscrapers using Grid & Flexbox techniques</p>
        </div>
        
        <div class="city-container">
          <div class="background-buildings sky">
            <div></div><div></div>
            <div class="bb1 building-wrap">
              <div class="bb1a bb1-window"></div>
              <div class="bb1b bb1-window"></div>
              <div class="bb1c bb1-window"></div>
              <div class="bb1d"></div>
            </div>
            <div class="bb2"><div class="bb2a"></div><div class="bb2b"></div></div>
            <div class="bb3"></div><div></div>
            <div class="bb4 building-wrap">
              <div class="bb4a"></div><div class="bb4b"></div>
              <div class="bb4c window-wrap">
                <div class="bb4-window"></div><div class="bb4-window"></div>
                <div class="bb4-window"></div><div class="bb4-window"></div>
              </div>
            </div>
            <div></div><div></div>
          </div>
          
          <div class="foreground-buildings">
            <div></div><div></div>
            <div class="fb1 building-wrap"><div class="fb1a"></div><div class="fb1b"></div><div class="fb1c"></div></div>
            <div class="fb2"><div class="fb2a"></div><div class="fb2b window-wrap"><div class="fb2-window"></div><div class="fb2-window"></div><div class="fb2-window"></div></div></div>
            <div></div>
            <div class="fb3 building-wrap">
              <div class="fb3a window-wrap"><div class="fb3-window"></div><div class="fb3-window"></div><div class="fb3-window"></div></div>
              <div class="fb3b"></div><div class="fb3a"></div><div class="fb3b"></div>
            </div>
            <div class="fb4"><div class="fb4a"></div><div class="fb4b"><div class="fb4-window"></div><div class="fb4-window"></div><div class="fb4-window"></div><div class="fb4-window"></div><div class="fb4-window"></div><div class="fb4-window"></div></div></div>
            <div class="fb5"></div><div class="fb6"></div><div></div><div></div>
          </div>
        </div>
        
        <div class="text-center mt-4">
          <p class="text-muted small">✨ Built with pure CSS | Grid & Flexbox | Responsive Design</p>
          <a href="index.html#Projects" class="btn-primary">
            <i class="fas fa-arrow-left me-2"></i> Back to Projects
          </a>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <p class="mb-0 small">© 2024 <span style="color: #1e88e5;">Anas Lotfy</span> | City Skyline - CSS Masterpiece</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
